# MySQL + API cho môi trường dev. Chạy từ gốc repo:
#   docker compose --env-file .env -f infrastructure/docker/compose.dev.yml up --build -d
# Biến cấu hình lấy từ `.env` ở gốc repo (mẫu: `.env.example`).
name: gymbase

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:?đặt MYSQL_DATABASE trong .env};User=${MYSQL_USER:?đặt MYSQL_USER trong .env};Password=${MYSQL_PASSWORD:?đặt MYSQL_PASSWORD trong .env}
  Jwt__SigningKey: ${Jwt__SigningKey:?đặt Jwt__SigningKey trong .env (Base64 của ít nhất 32 byte ngẫu nhiên)}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?đặt MYSQL_ROOT_PASSWORD trong .env}
    # Migration tạo trigger (sổ cái bien_dong_so_buoi); MySQL 8.4 bật binary log mặc định thì từ chối với user không có
    # quyền SUPER ("log_bin_trust_function_creators"). Dev không cần binary log nên tắt.
    command: ["--skip-log-bin"]
    ports:
      # 3307 để không đụng MySQL cài sẵn trên máy (3306); chỉ mở cho máy này.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Áp EF migration một lần rồi thoát; api chỉ khởi động khi bước này thành công.
  migrate:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
      target: migrator
    environment: *api-env
    command: ["--connection", "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-env
      # MinIO chưa nằm trong compose này nên lưu file vào volume cục bộ.
      Storage__DefaultProvider: LOCAL
    ports:
      # Giữ 5020 để EXPO_PUBLIC_API_URL của mobile không đổi; đặt API_PORT khác nếu cổng này đang bận.
      - "${API_PORT:-5020}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Image không có curl nên gọi /health (có kiểm tra DB) bằng bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql_data:
  uploads_data:
