# MÔI TRƯỜNG DEV: MySQL + API build từ mã nguồn, dữ liệu dùng để thử. Không dùng cho máy chủ thật (xem ../production).
# Chạy trong thư mục này; docker compose tự đọc `.env` cùng thư mục (mẫu: .env.example):
#   docker compose up --build -d
#
# Tách khỏi production: project `gymbase-dev` (container, volume, mạng riêng), `.env` riêng, MySQL và MinIO chỉ mở cho máy
# này (127.0.0.1), không nginx/HTTPS, không binary log, file tải lên lưu ở MinIO (S3 chạy cục bộ) thay vì S3 thật.
name: gymbase-dev

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:?đặt MYSQL_DATABASE trong .env};User=${MYSQL_USER:?đặt MYSQL_USER trong .env};Password=${MYSQL_PASSWORD:?đặt MYSQL_PASSWORD trong .env}
  Jwt__SigningKey: ${Jwt__SigningKey:?đặt Jwt__SigningKey trong .env (Base64 của ít nhất 32 byte ngẫu nhiên)}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Migration tạo trigger (sổ cái bien_dong_so_buoi); MySQL 8.4 bật binary log mặc định thì từ chối với user không có
    # quyền SUPER ("log_bin_trust_function_creators"). Dev không cần binary log nên tắt (production thì bật).
    command: ["--skip-log-bin"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?đặt MYSQL_ROOT_PASSWORD trong .env}
    ports:
      # 3307 để không đụng MySQL cài sẵn trên máy (3306); chỉ mở cho máy này.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # S3 chạy cục bộ để dev đi đúng đường lưu file của production. API tự tạo bucket ở lần tải lên đầu tiên.
  # Image không có shell hay curl nên không khai báo được healthcheck; api chỉ chờ container này chạy.
  # Cổng 9100/9101 (không phải 9000/9001) để không đụng MinIO chạy riêng ở infrastructure/docker/docker-compose.minio.yml.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"  # giao diện web quản lý
    volumes:
      - minio_data:/data

  # Ở dev, migration tự chạy mỗi lần `up` rồi thoát; api chỉ khởi động khi bước này thành công.
  # (Production thì chạy tay, có sao lưu trước.)
  migrate:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
      target: migrator
    environment: *api-env
    command: ["--connection", "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-env
      Storage__DefaultProvider: MINIO
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Storage__ForcePathStyle: "true"
    ports:
      # Giữ 5020 để EXPO_PUBLIC_API_URL của mobile không đổi; đặt API_PORT khác nếu cổng này đang bận.
      - "${API_PORT:-5020}:8080"
    volumes:
      # File đã tải lên trước khi chuyển sang MinIO (tep_tin.s3_bucket = LOCAL) vẫn đọc được từ volume này.
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      # Image không có curl nên gọi /health (có kiểm tra DB) bằng bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql_data:
  minio_data:
  uploads_data:
