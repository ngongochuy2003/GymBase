name: API image

# Build image API và migrator rồi đẩy lên GHCR để VPS kéo về (deploy/production). Tag: sha-<7 ký tự> cho mọi lần chạy,
# thêm tên tag git (v1.2.3) khi chạy từ tag. Không có tag latest để rollback luôn chỉ rõ một phiên bản.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/api/**'
      - 'infrastructure/docker/Dockerfile.api'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tên image và tag (GHCR yêu cầu chữ thường)
        id: names
        run: |
          prefix="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/gymbase"
          tags=("sha-${GITHUB_SHA::7}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags+=("${GITHUB_REF_NAME}"); fi
          {
            echo "api_tags<<EOF"
            for t in "${tags[@]}"; do echo "${prefix}-api:${t}"; done
            echo "EOF"
            echo "migrator_tags<<EOF"
            for t in "${tags[@]}"; do echo "${prefix}-migrator:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: infrastructure/docker/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ steps.names.outputs.api_tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build và đẩy migrator
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: infrastructure/docker/Dockerfile.api
          target: migrator
          push: true
          tags: ${{ steps.names.outputs.migrator_tags }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max
